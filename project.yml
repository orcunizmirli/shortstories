name: ShortSeries
options:
  bundleIdPrefix: com.shortseries
  deploymentTarget: { iOS: "17.0" }
packages:
  AppFoundation:  { path: Packages/AppFoundation }
  DesignSystem:   { path: Packages/DesignSystem }
  ContentKit:     { path: Packages/ContentKit }
  AnalyticsKit:   { path: Packages/AnalyticsKit }
  PlayerKit:      { path: Packages/PlayerKit }
  DiscoverKit:    { path: Packages/DiscoverKit }
  LibraryKit:     { path: Packages/LibraryKit }
  WalletKit:      { path: Packages/WalletKit }
  RewardsKit:     { path: Packages/RewardsKit }
  ProfileKit:     { path: Packages/ProfileKit }
  # SS-113 AdMob rewarded ads (F2) — gerçek GADRewardedAd adaptörü App'te RewardedAdProviding
  # portuna takılır (RewardsKit SDK-free kalır). Büyük binary xcframework dağıtımı.
  GoogleMobileAds: { url: https://github.com/googleads/swift-package-manager-google-mobile-ads, from: "11.0.0" }
targets:
  ShortSeriesApp:
    type: application
    platform: iOS
    sources:
      # CatalogHost yalnız DesignSystemCatalog target'ına aittir; iki @main çakışmasını önler.
      - path: App
        excludes: ["CatalogHost/**"]
      # SS-141 rich push SAF çekirdeği — NSE target'ıyla PAYLAŞILAN dosya. App target'a da derlenir ki
      # AppTests `@testable import ShortSeriesApp` ile izole test edebilsin (NSE runtime testi olmadan).
      - path: SharedPush
    dependencies:
      - { package: AppFoundation }
      - { package: DesignSystem }
      - { package: ContentKit }
      - { package: AnalyticsKit }
      - { package: PlayerKit }
      - { package: DiscoverKit }
      - { package: LibraryKit }
      - { package: WalletKit }
      - { package: RewardsKit }
      - { package: ProfileKit }
      # SS-113 AdMob: gerçek rewarded-ad SDK yalnız App target'ında (kompozisyon kökü).
      - { package: GoogleMobileAds, product: GoogleMobileAds }
      # SS-141 rich push: NSE app'e gömülür (Embed App Extensions). `embed: true` kopyalama fazını,
      # target bağımlılığı da build sırasını sağlar → `ShortSeriesApp` build'i NSE'yi de derler.
      - { target: NotificationServiceExtension, embed: true }
    # SS-142 platform kaydı: custom scheme (CFBundleURLTypes) + universal link (associated-domains).
    # Bu iki giriş noktası olmadan gelen link platformda tetiklenmez (onOpenURL çağrılmaz / AASA
    # eşleşmez). GENERATE_INFOPLIST_FILE array anahtarları (URL types) taşıyamadığından üretilen
    # Info.plist açık tanımlanır; orientation/launch-screen anahtarları buraya taşınır (02 §8.1/§8.2).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}                       # üretilen launch screen (portrait)
        UISupportedInterfaceOrientations:        # portrait-locked (kanon §2)
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:                         # custom scheme shortseries:// (02 §8.1)
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shortseries.app
            CFBundleURLSchemes:
              - shortseries
        UIBackgroundModes:                        # SS-140: sessiz/arka plan push teslimi (content-available)
          - remote-notification
        LSApplicationQueriesSchemes:              # SS-100: jailbreak paket-yöneticisi şema heuristiği
          - cydia                                 # (BasicDeviceIntegrityProbe.canOpenURL — best-effort/danışma)
          - sileo
          - zbra
          - filza
        # SS-113 AdMob rewarded ads. GADApplicationIdentifier = AdMob App ID; OLMADAN SDK start() CRASH eder.
        # TODO(gerçek AdMob App ID): şu an Google resmi TEST App ID'si — release öncesi gerçeğiyle değişecek
        # (AdMobConfiguration.applicationIdentifier ile EŞLEŞMELİ).
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # SS-156 ATT: reklam kişiselleştirmesi izni (Onboarding'de, değer önerisinden sonra — attPromptEnabled
        # bayrağı açıkken). Bu anahtar olmadan ATTrackingManager.requestTrackingAuthorization çökebilir/geçer.
        NSUserTrackingUsageDescription: >-
          İzin verirsen, ilgi alanlarına daha uygun reklamlar gösterebiliriz. İzin vermezsen de uygulamayı
          tam olarak kullanmaya devam edebilirsin.
        # SS-113 SKAdNetwork (iOS reklam ilişkilendirmesi, IDFA'sız). Google/AdMob'un yayınladığı standart
        # kimlik seti (mediation ağları dahil) — cstr6suwn9 Google'ın kendi kimliğidir. Kaynak: AdMob docs.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
