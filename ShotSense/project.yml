name: ShotSense
options:
  bundleIdPrefix: com.shotsense
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # KANON §2: App Icon dışında görsel varlık yoktur.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

packages:
  AppFoundation:   { path: Packages/AppFoundation }
  ShotCore:        { path: Packages/ShotCore }
  OCRKit:          { path: Packages/OCRKit }
  IntelligenceKit: { path: Packages/IntelligenceKit }

targets:
  ShotSenseApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # App **kompozisyon köküdür**: adaptörleri portlara bağlayan tek yer (03 §1).
      - { package: AppFoundation }
      - { package: ShotCore }
      - { package: OCRKit }
      - { package: IntelligenceKit }
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # KANON §10: portrait-locked.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 07-gizlilik.md §2 — her izin metni ne için kullanıldığını somut anlatır (Guideline 5.1.1).
        NSPhotoLibraryUsageDescription: >-
          Ekran görüntülerini cihazında okuyup kategorilere ayırmak ve aranabilir hâle getirmek
          için gerekli. Görsellerin telefonundan çıkmaz, hiçbir sunucuya gönderilmez.
        NSPhotoLibraryAddUsageDescription: >-
          Temizlik asistanında seçtiğin ekran görüntülerini silebilmek için gerekli. Silme her
          zaman senin onayınla yapılır.
        NSRemindersFullAccessUsageDescription: >-
          Bir ekran görüntüsündeki tarihi hatırlatıcıya çevirmek istediğinde kullanılır.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Bir ekran görüntüsündeki etkinliği takvimine eklemek istediğinde kullanılır.
        NSContactsUsageDescription: >-
          Bir ekran görüntüsündeki kişi bilgilerini rehberine kaydetmek istediğinde kullanılır.
        # Arka plan indeksleme (03 §7): yalnız cihaz boştayken/şarjdayken çalışır.
        BGTaskSchedulerPermittedIdentifiers:
          - com.shotsense.app.indexing
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shotsense.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ShotSenseApp:
    build:
      targets: { ShotSenseApp: all }
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
